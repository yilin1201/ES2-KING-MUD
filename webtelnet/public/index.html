<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ES2-KING WebTelnet</title>
  <style>
    body { margin: 0; background: #080b10; color: #e8edf2; font: 16px/1.45 Consolas, monospace; }
    main { max-width: 960px; margin: auto; padding: 1rem; }
    #terminal { min-height: 72vh; white-space: pre-wrap; overflow-wrap: anywhere; }
    form { display: flex; gap: .5rem; position: sticky; bottom: 0; background: #080b10; padding: .75rem 0; }
    input { flex: 1; padding: .7rem; background: #151b24; color: white; border: 1px solid #52606d; }
    button { padding: .7rem 1rem; }
  </style>
</head>
<body><main>
  <div id="status">連線中……</div>
  <pre id="terminal" aria-live="polite"></pre>
  <form><input id="command" autocomplete="off" aria-label="遊戲指令"><button>送出</button></form>
</main>
<script>
  const status = document.querySelector("#status");
  const terminal = document.querySelector("#terminal");
  const command = document.querySelector("#command");
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  const socket = new WebSocket(`${protocol}//${location.host}/mud`);
  socket.binaryType = "arraybuffer";
  const decoder = new TextDecoder("utf-8");
  // ANSI（終端色彩控制碼）先移除；之後可在不碰 mudlib 的情況下加入彩色呈現。
  const append = data => {
    terminal.textContent += decoder.decode(data, { stream: true }).replace(/\x1b\[[0-9;?]*[ -/]*[@-~]/g, "");
    window.scrollTo(0, document.body.scrollHeight);
  };
  socket.onopen = () => { status.textContent = "已連線 ES2-KING"; command.focus(); };
  socket.onmessage = event => append(event.data);
  socket.onclose = event => { status.textContent = `連線中斷 (${event.code})`; };
  socket.onerror = () => { status.textContent = "WebSocket 橋接連線失敗"; };
  document.querySelector("form").addEventListener("submit", event => {
    event.preventDefault();
    if (socket.readyState === WebSocket.OPEN) socket.send(command.value + "\r\n");
    command.value = "";
  });
</script></body></html>
