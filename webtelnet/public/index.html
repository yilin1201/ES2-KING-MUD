<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ES2-KING WebTelnet</title>
  <style>
    :root { --terminal-font: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, "Noto Sans Mono CJK TC", "PingFang TC", "Microsoft JhengHei", monospace; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: #080b10; color: #e8edf2; font: 16px/1.45 var(--terminal-font); }
    main { width: 100%; max-width: 960px; margin: auto; padding: 1rem max(1rem, env(safe-area-inset-right)) 1rem max(1rem, env(safe-area-inset-left)); }
    #terminal {
      min-height: 72vh;
      margin: 0;
      white-space: pre;
      overflow-x: auto;
      overflow-y: visible;
      overflow-wrap: normal;
      word-break: normal;
      font: 15px/1.35 var(--terminal-font);
      letter-spacing: 0;
      tab-size: 8;
      -webkit-overflow-scrolling: touch;
    }
    form { display: flex; gap: .5rem; position: sticky; bottom: 0; background: #080b10; padding: .75rem 0 max(.75rem, env(safe-area-inset-bottom)); }
    input { min-width: 0; flex: 1; padding: .7rem; font-size: 16px; background: #151b24; color: white; border: 1px solid #52606d; }
    button { padding: .7rem 1rem; font-size: 16px; }
    @media (max-width: 600px) {
      main { padding-top: .5rem; padding-left: max(.5rem, env(safe-area-inset-left)); padding-right: max(.5rem, env(safe-area-inset-right)); }
      #terminal { min-height: 70vh; font-size: 14px; }
    }
  </style>
</head>
<body><main>
  <div id="status">連線中……</div>
  <pre id="terminal" aria-live="polite"></pre>
  <form><input id="command" autocomplete="off" aria-label="遊戲指令"><button>送出</button></form>
</main>
<script>
  const status = document.querySelector("#status");
  const terminal = document.querySelector("#terminal");
  const command = document.querySelector("#command");
  const protocol = location.protocol === "https:" ? "wss:" : "ws:";
  let socket;
  let retryDelay = 1000;
  // TextDecoder（文字解碼器）以串流 UTF-8 解碼，保留跨 WebSocket 資料塊的中文字元。
  const decoder = new TextDecoder("utf-8");
  // ANSI（終端色彩控制碼）先移除；之後可在不碰 mudlib 的情況下加入彩色呈現。
  const append = data => {
    terminal.textContent += decoder.decode(data, { stream: true }).replace(/\x1b\[[0-9;?]*[ -/]*[@-~]/g, "");
    window.scrollTo(0, document.body.scrollHeight);
  };
  function connect() {
    status.textContent = "連線中……";
    socket = new WebSocket(`${protocol}//${location.host}/mud`);
    socket.binaryType = "arraybuffer";
    socket.onopen = () => {
      retryDelay = 1000;
      status.textContent = "已連線 ES2-KING";
      command.focus();
    };
    socket.onmessage = event => append(event.data);
    socket.onclose = event => {
      status.textContent = `連線中斷 (${event.code})，將自動重連`;
      setTimeout(connect, retryDelay);
      retryDelay = Math.min(retryDelay * 2, 10000);
    };
    socket.onerror = () => { status.textContent = "WebSocket 橋接連線失敗"; };
  }
  connect();
  document.querySelector("form").addEventListener("submit", event => {
    event.preventDefault();
    if (socket.readyState === WebSocket.OPEN) socket.send(command.value + "\r\n");
    command.value = "";
  });
</script></body></html>
