name: Original ES2 Driver Build

on:
  workflow_dispatch:
  push:
    branches: [build/executable-mud-phase1]
    paths: ['.github/workflows/original-es2-driver-build.yml','scripts/bootstrap_original_es2.sh','original_es2/runtime/**']
  pull_request:
    paths: ['.github/workflows/original-es2-driver-build.yml','scripts/bootstrap_original_es2.sh','original_es2/runtime/**']

jobs:
  build-neolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ES2-KING
        uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison netcat-openbsd
          python -m pip install --upgrade cmake
      - name: Bootstrap Original ES2 and Neolith
        run: bash scripts/bootstrap_original_es2.sh
      - name: Install M2 runtime-only attribute probe
        run: |
          cat > .runtime/original-es2/mudlib/cmds/usr/m2probe.c <<'LPC'
          inherit F_CLEAN_UP;
          int main(object me, string arg) {
              string *keys = ({"str","cor","int","spi","cps","dex","con","wis"});
              string k, out = "M2PROBE";
              int raw, eff, boosted;
              foreach(k in keys) {
                  raw = me->query_attr(k, 1);
                  eff = me->query_attr(k);
                  out += sprintf(" %s=%d/%d", k, raw, eff);
              }
              raw = me->query_attr("str", 1);
              eff = me->query_attr("str");
              me->add_temp("apply/str", 2);
              boosted = me->query_attr("str");
              me->add_temp("apply/str", -2);
              out += sprintf(" STRTEST=%d/%d/%d", raw, eff, boosted);
              out += sprintf(" HP=%d/%d GIN=%d/%d KEE=%d/%d SEN=%d/%d RACE=%s LEVEL=%d", me->query_stat("HP"), me->query_stat_maximum("HP"), me->query_stat("gin"), me->query_stat_maximum("gin"), me->query_stat("kee"), me->query_stat_maximum("kee"), me->query_stat("sen"), me->query_stat_maximum("sen"), me->query_race(), me->query_level());
              write(out + "\n");
              return 1;
          }
          LPC
      - name: Configure Neolith
        working-directory: .runtime/original-es2/neolith
        run: cmake --preset linux -DBUILD_TESTING=OFF
      - name: Build Neolith
        working-directory: .runtime/original-es2/neolith
        run: cmake --build --preset dev-linux
      - name: Locate driver executable
        run: |
          DRIVER="$(find .runtime/original-es2/neolith/out -type f -name neolith -perm -111 | head -n 1)"
          test -n "$DRIVER"
          echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"
      - name: Boot Original ES2 Mudlib
        shell: bash
        run: |
          set -euo pipefail
          cd .runtime/original-es2
          DRIVER_ABS="$(realpath "$GITHUB_WORKSPACE/$DRIVER")"
          "$DRIVER_ABS" -f neolith.conf -c > "$RUNNER_TEMP/es2-boot.log" 2>&1 &
          PID=$!
          echo "ES2_PID=$PID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            kill -0 "$PID" 2>/dev/null || break
            if nc -z 127.0.0.1 4000; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/es2-boot.log"; exit 1
      - name: M2 live Human attribute and statistic verification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import telnetlib,time,re,sys
          tn=telnetlib.Telnet('127.0.0.1',4000,timeout=5); buf=bytearray(); closed=False
          def rd(t=.8):
            global closed
            end=time.time()+t
            while time.time()<end and not closed:
              try:
                d=tn.read_very_eager()
                if d: buf.extend(d)
              except (EOFError,ConnectionResetError,BrokenPipeError,OSError): closed=True
              time.sleep(.05)
          def line(s,t=.8):
            global closed
            if closed:return
            try: tn.write(s.encode()+b'\r\n')
            except OSError: closed=True; return
            rd(t)
          def key(s,t=.8):
            tn.write(s.encode()); rd(t)
          rd(1); line('mone'); key('Y'); line('m1pass'); line('m1pass'); line('none'); key('\r'); key('M'); line('測試玩家'); key('Y',1.5)
          line('look'); line('score'); line('west'); line('m2probe',1.2)
          text=re.sub(r'\x1b\[[0-9;?]*[ -/]*[@-~]','',buf.decode(errors='replace')); norm=re.sub(r'\s+',' ',text)
          print(text)
          base=['您的使用者代號','的冒險開始了','客棧大堂','【 平民 】','目前是等級 1 的平民','男性人類','形體','精','氣','神','廚房','M2PROBE']
          miss=[x for x in base if x not in norm]
          if miss: print('M2 FAIL missing live evidence:',miss,file=sys.stderr); sys.exit(1)
          m=re.search(r'M2PROBE(.*?)STRTEST=(\d+)/(\d+)/(\d+) HP=(\d+)/(\d+) GIN=(\d+)/(\d+) KEE=(\d+)/(\d+) SEN=(\d+)/(\d+) RACE=(\w+) LEVEL=(\d+)',norm)
          if not m: print('M2 FAIL probe format not found',file=sys.stderr); sys.exit(1)
          attrs=dict((k,(int(a),int(e))) for k,a,e in re.findall(r'(str|cor|int|spi|cps|dex|con|wis)=(\d+)/(\d+)',m.group(1)))
          if set(attrs)!={'str','cor','int','spi','cps','dex','con','wis'}: print('M2 FAIL missing attrs',attrs,file=sys.stderr); sys.exit(1)
          # human.c initializes every raw attribute to 13..18. With ENABLE_ANTISPAM,
          # logind.c applies one -1 penalty on this first local creation, so one live
          # post-login attribute may legitimately be 12. Validate the actual runtime rule.
          if any(not 12<=a<=18 or a!=e for a,e in attrs.values()): print('M2 FAIL live attr range/base-effective',attrs,file=sys.stderr); sys.exit(1)
          if sum(1 for a,e in attrs.values() if a<13)>1: print('M2 FAIL more than one anti-spam adjusted attribute',attrs,file=sys.stderr); sys.exit(1)
          sr,se,sb=map(int,m.group(2,3,4))
          if not (sr==se and sb==sr+2): print('M2 FAIL temporary effective attribute mechanism',sr,se,sb,file=sys.stderr); sys.exit(1)
          hp,hpm,gin,ginm,kee,keem,sen,senm=map(int,m.group(5,6,7,8,9,10,11,12)); race=m.group(13); level=int(m.group(14))
          if race!='human' or level!=1 or (gin,ginm,kee,keem,sen,senm)!=(30,30,30,30,30,30): print('M2 FAIL race/level/resources',file=sys.stderr); sys.exit(1)
          if hpm != attrs['con'][0]*5 or hp!=hpm: print('M2 FAIL HP/con relationship',hp,hpm,attrs['con'],file=sys.stderr); sys.exit(1)
          print('M2 PASS LIVE ATTRIBUTES:',attrs)
          print('M2 PASS BASE/EFFECTIVE: str',sr,'->',sb,'with temporary +2, raw unchanged')
          print('M2 PASS STATS: HP',hp,'/',hpm,'Gin/Kee/Sen 30/30; Human Lv.1')
          print('M2 NOTE: Human initializer is 13..18; live post-login may include one -1 ENABLE_ANTISPAM adjustment.')
          line('quit'); rd(.5); tn.close()
          PY
      - name: Stop Original ES2
        if: always()
        run: |
          if [[ -n "${ES2_PID:-}" ]]; then kill "$ES2_PID" 2>/dev/null || true; fi
      - name: Record M2 result
        run: |
          echo 'M2 PASS: live runtime probe verified all eight Human attributes, Original anti-spam adjustment, base/effective behavior, HP/con relation, and Gin/Kee/Sen.'
