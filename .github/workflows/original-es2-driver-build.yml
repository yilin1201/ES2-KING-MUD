name: Original ES2 Driver Build

on:
  workflow_dispatch:
  push:
    branches:
      - build/executable-mud-phase1
    paths:
      - '.github/workflows/original-es2-driver-build.yml'
      - 'scripts/bootstrap_original_es2.sh'
      - 'original_es2/runtime/**'
  pull_request:
    paths:
      - '.github/workflows/original-es2-driver-build.yml'
      - 'scripts/bootstrap_original_es2.sh'
      - 'original_es2/runtime/**'

jobs:
  build-neolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ES2-KING
        uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison netcat-openbsd
          python -m pip install --upgrade cmake
      - name: Bootstrap Original ES2 and Neolith
        run: bash scripts/bootstrap_original_es2.sh
      - name: Configure Neolith
        working-directory: .runtime/original-es2/neolith
        run: cmake --preset linux -DBUILD_TESTING=OFF
      - name: Build Neolith
        working-directory: .runtime/original-es2/neolith
        run: cmake --build --preset dev-linux
      - name: Locate driver executable
        run: |
          DRIVER="$(find .runtime/original-es2/neolith/out -type f -name neolith -perm -111 | head -n 1)"
          test -n "$DRIVER"
          echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"
      - name: Boot Original ES2 Mudlib
        shell: bash
        run: |
          set -euo pipefail
          cd .runtime/original-es2
          DRIVER_ABS="$(realpath "$GITHUB_WORKSPACE/$DRIVER")"
          "$DRIVER_ABS" -f neolith.conf -c > "$RUNNER_TEMP/es2-boot.log" 2>&1 &
          PID=$!
          echo "ES2_PID=$PID" >> "$GITHUB_ENV"
          BOOT_OK=0
          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            if nc -z 127.0.0.1 4000; then BOOT_OK=1; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/es2-boot.log" || true
          test "$BOOT_OK" -eq 1
      - name: M1 create Human/Commoner/Lv1 and enter world
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import telnetlib, time, re, sys
          tn = telnetlib.Telnet('127.0.0.1', 4000, timeout=5)
          transcript = bytearray()
          def read_for(seconds=1.0):
              end = time.time() + seconds
              while time.time() < end:
                  data = tn.read_very_eager()
                  if data: transcript.extend(data)
                  time.sleep(0.05)
          def send_line(line, wait=0.8):
              tn.write(line.encode('utf-8') + bytes((13, 10)))
              read_for(wait)
          def send_key(key, wait=0.8):
              tn.write(key.encode('ascii'))
              read_for(wait)
          read_for(1.0)
          send_line('mone')
          send_key('Y')
          send_line('m1pass')
          send_line('m1pass')
          send_line('none')
          send_key('\r')
          send_key('M')
          send_line('測試玩家')
          send_key('Y', 1.5)
          send_line('look')
          send_line('score')
          send_line('north', 1.0)
          read_for(0.5)
          tn.close()
          text = transcript.decode('utf-8', errors='replace')
          clean = re.sub(r'\x1b\[[0-9;?]*[ -/]*[@-~]', '', text)
          print('----- M1 transcript -----')
          print(clean)
          print('-------------------------')
          required = [('login','您的使用者代號'),('race','選擇你的角色所屬的種族'),('name','您的顯示名稱')]
          missing = [label for label, token in required if token not in clean]
          if missing:
              print('M1 FAIL missing stages:', ', '.join(missing), file=sys.stderr)
              sys.exit(1)
          if '臂力' not in clean and '膂力' not in clean:
              print('M1 FAIL: score probe did not return recognizable character status.', file=sys.stderr)
              sys.exit(1)
          PY
      - name: Stop Original ES2
        if: always()
        run: |
          if [[ -n "${ES2_PID:-}" ]]; then kill "$ES2_PID" 2>/dev/null || true; fi
      - name: Record M1 result
        run: |
          echo 'M1 PASS: login, character creation, Human selection, world entry and gameplay command probe completed.'
