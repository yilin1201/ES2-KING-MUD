name: Original ES2 Driver Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/original-es2-driver-build.yml'
      - 'scripts/bootstrap_original_es2.sh'
      - 'original_es2/runtime/**'

jobs:
  build-neolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ES2-KING
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison
          python -m pip install --upgrade cmake

      - name: Bootstrap Original ES2 and Neolith
        run: bash scripts/bootstrap_original_es2.sh

      - name: Configure Neolith
        working-directory: .runtime/original-es2/neolith
        run: cmake --preset linux-gcc -DBUILD_TESTING=OFF

      - name: Build Neolith
        working-directory: .runtime/original-es2/neolith
        run: cmake --build --preset dev-linux-gcc

      - name: Locate driver executable
        run: |
          DRIVER="$(find .runtime/original-es2/neolith/out -type f -name neolith -perm -111 | head -n 1)"
          test -n "$DRIVER"
          echo "Neolith executable: $DRIVER"

      - name: Record scope
        run: |
          echo 'Driver build passed. This does NOT yet prove the ES2 Mudlib boot/login flow.'
