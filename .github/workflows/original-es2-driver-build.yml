name: Original ES2 Driver Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/original-es2-driver-build.yml'
      - 'scripts/bootstrap_original_es2.sh'
      - 'original_es2/runtime/**'

jobs:
  build-neolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ES2-KING
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison netcat-openbsd
          python -m pip install --upgrade cmake

      - name: Bootstrap Original ES2 and Neolith
        run: bash scripts/bootstrap_original_es2.sh

      - name: Configure Neolith
        working-directory: .runtime/original-es2/neolith
        run: cmake --preset linux -DBUILD_TESTING=OFF

      - name: Build Neolith
        working-directory: .runtime/original-es2/neolith
        run: cmake --build --preset dev-linux

      - name: Locate driver executable
        run: |
          DRIVER="$(find .runtime/original-es2/neolith/out -type f -name neolith -perm -111 | head -n 1)"
          test -n "$DRIVER"
          echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"
          echo "Neolith executable: $DRIVER"

      - name: Boot Original ES2 Mudlib
        shell: bash
        run: |
          set -euo pipefail
          cd .runtime/original-es2
          DRIVER_ABS="$(realpath "$GITHUB_WORKSPACE/$DRIVER")"
          "$DRIVER_ABS" -f neolith.conf -c > "$RUNNER_TEMP/es2-boot.log" 2>&1 &
          PID=$!
          echo "ES2_PID=$PID" >> "$GITHUB_ENV"
          BOOT_OK=0
          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            if nc -z 127.0.0.1 4000; then BOOT_OK=1; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/es2-boot.log" || true
          test "$BOOT_OK" -eq 1

      - name: M1 create Human/Commoner/Lv1 and enter world
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import socket, time, re, sys
          HOST, PORT = '127.0.0.1', 4000
          transcript = bytearray()
          s = socket.create_connection((HOST, PORT), timeout=5)
          s.settimeout(0.25)

          def read_for(seconds=1.0):
              end = time.time() + seconds
              while time.time() < end:
                  try:
                      data = s.recv(8192)
                      if not data: break
                      transcript.extend(data)
                  except socket.timeout:
                      pass

          def send(line, wait=0.8):
              s.sendall(line.encode('utf-8') + b'\n')
              read_for(wait)

          read_for(1.0)
          send('mone')
          send('Y')
          send('m1pass')
          send('m1pass')
          send('none')
          send('human')
          send('M')
          send('測試玩家')
          send('Y', 1.5)
          send('look')
          send('score')
          send('north', 1.0)
          read_for(0.5)
          s.close()

          text = transcript.decode('utf-8', errors='replace')
          clean = re.sub(r'\x1b\[[0-9;?]*[ -/]*[@-~]', '', text)
          open('/tmp/es2-m1.txt', 'w', encoding='utf-8').write(clean)
          print('----- M1 transcript -----')
          print(clean)
          print('-------------------------')

          required = [
              ('login', '您的使用者代號'),
              ('race', '選擇你的角色所屬的種族'),
              ('name', '您的顯示名稱'),
              ('created', '的冒險開始了'),
          ]
          missing = [label for label, token in required if token not in clean]
          if missing:
              print('M1 FAIL missing stages:', ', '.join(missing), file=sys.stderr)
              sys.exit(1)
          PY

      - name: Stop Original ES2
        if: always()
        run: |
          if [[ -n "${ES2_PID:-}" ]]; then kill "$ES2_PID" 2>/dev/null || true; fi

      - name: Record M1 result
        run: echo 'M1 PASS: login, character creation, Human selection, world entry and gameplay command probe completed.'
