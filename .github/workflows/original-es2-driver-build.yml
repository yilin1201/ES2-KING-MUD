name: Original ES2 Driver Build

on:
  workflow_dispatch:
  push:
    branches:
      - build/executable-mud-phase1
    paths:
      - '.github/workflows/original-es2-driver-build.yml'
      - 'scripts/bootstrap_original_es2.sh'
      - 'original_es2/runtime/**'
  pull_request:
    paths:
      - '.github/workflows/original-es2-driver-build.yml'
      - 'scripts/bootstrap_original_es2.sh'
      - 'original_es2/runtime/**'

jobs:
  build-neolith:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ES2-KING
        uses: actions/checkout@v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison netcat-openbsd
          python -m pip install --upgrade cmake
      - name: Bootstrap Original ES2 and Neolith
        run: bash scripts/bootstrap_original_es2.sh
      - name: Configure Neolith
        working-directory: .runtime/original-es2/neolith
        run: cmake --preset linux -DBUILD_TESTING=OFF
      - name: Build Neolith
        working-directory: .runtime/original-es2/neolith
        run: cmake --build --preset dev-linux
      - name: Locate driver executable
        run: |
          DRIVER="$(find .runtime/original-es2/neolith/out -type f -name neolith -perm -111 | head -n 1)"
          test -n "$DRIVER"
          echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"
      - name: Boot Original ES2 Mudlib
        shell: bash
        run: |
          set -euo pipefail
          cd .runtime/original-es2
          DRIVER_ABS="$(realpath "$GITHUB_WORKSPACE/$DRIVER")"
          "$DRIVER_ABS" -f neolith.conf -c > "$RUNNER_TEMP/es2-boot.log" 2>&1 &
          PID=$!
          echo "ES2_PID=$PID" >> "$GITHUB_ENV"
          BOOT_OK=0
          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            if nc -z 127.0.0.1 4000; then BOOT_OK=1; break; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/es2-boot.log" || true
          test "$BOOT_OK" -eq 1
      - name: M1 create Human/Commoner/Lv1 and enter world
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import telnetlib, time, re, sys
          tn = telnetlib.Telnet('127.0.0.1', 4000, timeout=5)
          transcript = bytearray()
          connection_closed = False
          def read_for(seconds=1.0):
              global connection_closed
              end = time.time() + seconds
              while time.time() < end and not connection_closed:
                  try:
                      data = tn.read_very_eager()
                      if data: transcript.extend(data)
                  except (EOFError, ConnectionResetError, BrokenPipeError, OSError):
                      connection_closed = True
                      break
                  time.sleep(0.05)
          def send_line(line, wait=0.8):
              global connection_closed
              if connection_closed: return
              try:
                  tn.write(line.encode('utf-8') + bytes((13, 10)))
              except (EOFError, ConnectionResetError, BrokenPipeError, OSError):
                  connection_closed = True
                  return
              read_for(wait)
          def send_key(key, wait=0.8):
              global connection_closed
              if connection_closed: return
              try:
                  tn.write(key.encode('ascii'))
              except (EOFError, ConnectionResetError, BrokenPipeError, OSError):
                  connection_closed = True
                  return
              read_for(wait)
          read_for(1.0)
          send_line('mone')
          send_key('Y')
          send_line('m1pass')
          send_line('m1pass')
          send_line('none')
          send_key('\r')
          send_key('M')
          send_line('測試玩家')
          send_key('Y', 1.5)
          send_line('look')
          send_line('score')
          send_line('west', 1.0)
          send_line('quit', 1.0)
          read_for(0.5)
          try: tn.close()
          except OSError: pass
          text = transcript.decode('utf-8', errors='replace')
          clean = re.sub(r'\x1b\[[0-9;?]*[ -/]*[@-~]', '', text)
          normalized = re.sub(r'\s+', ' ', clean)
          print('----- M1/M2 live transcript -----')
          print(clean)
          print('---------------------------------')
          required = [('login','您的使用者代號'),('race','選擇你的角色所屬的種族'),('name','您的顯示名稱'),('created','的冒險開始了'),('spawn','客棧大堂'),('commoner','【 平民 】'),('level1','目前是等級 1 的平民'),('human','男性人類'),('hp','形體'),('gin','精'),('kee','氣'),('sen','神'),('food','食物'),('water','飲水'),('fatigue','疲勞'),('movement','廚房'),('return_exit','這裡唯一的出口是 east'),('quit','歡迎下次再來')]
          missing = [label for label, token in required if token not in normalized]
          if missing:
              print('M1/M2 FAIL missing evidence:', ', '.join(missing), file=sys.stderr); sys.exit(1)
          if 'What?' in clean:
              print('M1/M2 FAIL: gameplay probe returned an invalid command.', file=sys.stderr); sys.exit(1)
          PY
      - name: M2 verify persisted Human attributes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, sys
          root = Path('.runtime/original-es2')
          candidates = list(root.rglob('mone.o'))
          print('M2 save candidates:', [str(p) for p in candidates])
          if not candidates:
              print('M2 FAIL: character quit succeeded but live character save file mone.o was not found.', file=sys.stderr); sys.exit(1)
          data = candidates[0].read_text(encoding='utf-8', errors='replace')
          print('----- M2 persisted character evidence -----')
          for line in data.splitlines():
              if any(k in line.lower() for k in ('attribute','statistic','race','class','level')):
                  print(line)
          print('-------------------------------------------')
          attrs = {}
          for key in ('str','cor','int','spi','cps','dex','con','wis'):
              patterns = [rf'"{key}"\s*:\s*(\d+)', rf'{key}\s+(\d+)']
              for pattern in patterns:
                  m = re.search(pattern, data)
                  if m:
                      attrs[key] = int(m.group(1)); break
          print('M2 parsed raw attributes:', attrs)
          if set(attrs) != {'str','cor','int','spi','cps','dex','con','wis'}:
              print('M2 FAIL: could not parse all eight live attributes.', file=sys.stderr); sys.exit(1)
          bad = {k:v for k,v in attrs.items() if not 13 <= v <= 18}
          if bad:
              print('M2 FAIL: Human raw attribute outside 13..18:', bad, file=sys.stderr); sys.exit(1)
          for token, label in [('human','human'),('commoner','commoner')]:
              if token not in data:
                  print('M2 FAIL: persisted character missing '+label, file=sys.stderr); sys.exit(1)
          print('M2 LIVE ATTRIBUTES:', ' '.join(f'{k}={attrs[k]}' for k in ('str','cor','int','spi','cps','dex','con','wis')))
          print('M2 attribute range PASS: all Human raw attributes are 13..18.')
          PY
      - name: Stop Original ES2
        if: always()
        run: |
          if [[ -n "${ES2_PID:-}" ]]; then kill "$ES2_PID" 2>/dev/null || true; fi
      - name: Record M2 result
        run: |
          echo 'M2 PASS: live Human/Commoner/Lv.1 creation persisted all eight Original ES2 raw attributes in the Human 13..18 range; live score separately verifies HP and Gin/Kee/Sen.'
