name: ES2-KING Integration Look Gate

# 只跑低成本語法與來源契約檢查；不建置完整 Docker、不部署，也不取代 Neolith Runtime Gate。
on:
  push:
    branches:
      - integration/es2m-audit-import-20261017
    paths:
      - "Dockerfile"
      - "scripts/apply_es2_king_expansion.sh"
      - "scripts/test_neolith_preload_look.sh"
      - "scripts/test_es2m_training_dummy.py"
      - "scripts/test_original_player_creation_e2e.mjs"
      - "scripts/test_original_player_creation_e2e.sh"
      - "docs/status/ES2M_COMPATIBILITY_BATCH_PLAN_20261017.md"
      - "docs/status/ES2M_SOURCE_SYNC_MANIFEST_20261017.json"
      - "source/es2m_updates/**"
      - "es2m_snapshot/mudlib/**"
      - "docs/es2m_reference/ES2M_戰鬥流程說明_71693beb.md"
      - "scripts/test_es2m_source_sync_manifest.py"
      - "scripts/import_es2m_latest_missing_files.py"
      - "scripts/test_import_es2m_latest_missing_files.py"
      - "scripts/merge_es2m_latest_changes_safe.py"
      - "scripts/test_merge_es2m_latest_changes_safe.py"
      - ".gitmodules"
      - ".github/workflows/es2-king-integration-look-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: es2-king-integration-look-gate
  cancel-in-progress: false

jobs:
  source-gates:
    name: Look patch and numeric-ID policy static gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout integration branch and pinned ES2M source
        uses: actions/checkout@v4
        with:
          ref: integration/es2m-audit-import-20261017
          submodules: recursive

      - name: Bash syntax
        run: |
          bash -n scripts/apply_es2_king_expansion.sh
          bash -n scripts/test_neolith_preload_look.sh
          bash -n scripts/test_original_player_creation_e2e.sh

      - name: Python syntax
        run: |
          python3 -m py_compile scripts/test_es2m_training_dummy.py

      - name: Node syntax
        run: node --check scripts/test_original_player_creation_e2e.mjs

      - name: ES2M training dummy source contract
        run: python3 scripts/test_es2m_training_dummy.py

      - name: ES2M full source inventory and pin gate
        run: python3 scripts/test_es2m_source_sync_manifest.py

      - name: Safe latest ES2M additive importer unit tests
        run: python3 -m unittest -v scripts/test_import_es2m_latest_missing_files.py

      - name: Safe latest ES2M three-way merge unit tests
        run: python3 -m unittest -v scripts/test_merge_es2m_latest_changes_safe.py

      - name: Race and birth attribute source contracts
        run: |
          python3 scripts/test_es2m_birth_attribute_contract.py
          python3 scripts/test_es2m_race_command_contract.py

      - name: Verify numeric ID policy follows Original ES2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("scripts/test_original_player_creation_e2e.mjs").read_text(encoding="utf-8")
          assert "async function testNumericIdRejected()" in p
          assert "ORIGINAL_PLAYER_CREATION_NUMERIC_ID_REJECTED_PASS" in p
          assert "await testNumericIdRejected();" in p
          assert "ORIGINAL_PLAYER_CREATION_NUMERIC_ID_E2E_PASS" not in p
          sh = Path("scripts/test_original_player_creation_e2e.sh").read_text(encoding="utf-8")
          assert "ORIGINAL_PLAYER_CREATION_NUMERIC_ID_REJECTED_PASS" in sh
          print("ORIGINAL ES2 NUMERIC-ID REJECTION CONTRACT PASS")
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "## ES2-KING integration look gate"
            echo
            echo "- This workflow checks source syntax and static contracts only."
            echo "- It does not claim that the Docker build or the Neolith look preload passed."
            echo "- Full runtime verification remains in the Dockerfile gate."
          } >> "$GITHUB_STEP_SUMMARY"

  # Full Docker builder is opt-in via a meaningful commit message marker; no image push/deployment.
  docker-builder-validation:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[docker-validate]') }}
    name: Full Docker builder validation (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch and pinned ES2M source
        uses: actions/checkout@v4
        with:
          ref: integration/es2m-audit-import-20261017
          submodules: recursive
      - name: Build full Docker builder target
        run: docker build --progress=plain --target builder -t es2-king-integration-validation:ci .
      - name: Extract ES2M import reports from successful builder image
        if: always()
        run: |
          if ! docker image inspect es2-king-integration-validation:ci >/dev/null 2>&1; then
            echo "Builder image unavailable; no import report can be extracted."
            exit 0
          fi
          container_id="$(docker create es2-king-integration-validation:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for report in es2m-latest-qiaoyin-stage.json es2m-latest-additive-import.json es2m-latest-three-way-merge.json; do
            docker cp "$container_id:/build/$report" "$report" 2>/dev/null || true
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          from os import environ
          summary = Path(environ["GITHUB_STEP_SUMMARY"])
          lines = ["## ES2M latest-source import report", ""]
          for name in ("es2m-latest-qiaoyin-stage.json", "es2m-latest-additive-import.json", "es2m-latest-three-way-merge.json"):
              path = Path(name)
              if not path.is_file():
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              lines += [f"### {name}", f"- Status: `{data.get('status', 'unknown')}`"]
              for key, value in data.items():
                  if isinstance(value, list):
                      lines.append(f"- {key}: {len(value)}")
              for key in ("copied", "source_replaced", "merged", "preserved_conflicts"):
                  values = data.get(key, [])
                  if values and isinstance(values[0], dict):
                      lines.append(f"- {key} paths: " + ", ".join(str(x.get("path", "?")) for x in values))
              lines.append("")
          summary.write_text(summary.read_text(encoding="utf-8") + "\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Upload ES2M import reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es2m-latest-import-reports
          path: es2m-*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Validation boundary summary
        if: always()
        run: |
          {
            echo "## ES2-KING Docker builder validation"
            echo
            echo "- Target: builder stage only; no registry push and no deployment."
            echo "- The build must pass the generated look.c Neolith preload gate and all subsequent Dockerfile gates."
          } >> "$GITHUB_STEP_SUMMARY"
