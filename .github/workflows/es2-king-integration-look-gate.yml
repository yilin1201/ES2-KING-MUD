name: ES2-KING Integration Look Gate

# 只跑低成本語法與來源契約檢查；不建置完整 Docker、不部署，也不取代 Neolith Runtime Gate。
on:
  push:
    branches:
      - integration/es2m-audit-import-20261017
    paths:
      - "Dockerfile"
      - "scripts/apply_es2_king_expansion.sh"
      - "scripts/test_neolith_preload_look.sh"
      - "scripts/test_es2m_training_dummy.py"
      - "scripts/test_original_player_creation_e2e.mjs"
      - "scripts/apply_es2m_login_policy_runtime.py"
      - "scripts/test_apply_es2m_login_policy_runtime.py"
      - "scripts/test_original_player_creation_e2e.sh"
      - "docs/status/ES2M_COMPATIBILITY_BATCH_PLAN_20261017.md"
      - "docs/status/ES2M_SOURCE_SYNC_MANIFEST_20261017.json"
      - "source/es2m_updates/**"
      - "es2m_snapshot/mudlib/**"
      - "docs/es2m_reference/ES2M_戰鬥流程說明_71693beb.md"
      - "scripts/test_es2m_source_sync_manifest.py"
      - "scripts/import_es2m_latest_missing_files.py"
      - "scripts/test_import_es2m_latest_missing_files.py"
      - "scripts/merge_es2m_latest_changes_safe.py"
      - "scripts/test_merge_es2m_latest_changes_safe.py"
      - "scripts/sync_es2m_latest_import_overlay.py"
      - "scripts/classify_es2m_latest_conflicts.py"
      - "scripts/test_classify_es2m_latest_conflicts.py"
      - "scripts/test_sync_es2m_latest_import_overlay.py"
      - "es2m_snapshot/latest_import_overlay/**"
      - ".gitmodules"
      - ".github/workflows/es2-king-integration-look-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: es2-king-integration-look-gate
  cancel-in-progress: false

jobs:
  source-gates:
    name: Look patch and numeric-ID policy static gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout integration branch and pinned ES2M source
        uses: actions/checkout@v4
        with:
          ref: integration/es2m-audit-import-20261017
          submodules: recursive

      - name: Bash syntax
        run: |
          bash -n scripts/apply_es2_king_expansion.sh
          bash -n scripts/test_neolith_preload_look.sh
          bash -n scripts/test_original_player_creation_e2e.sh

      - name: Python syntax
        run: |
          python3 -m py_compile scripts/test_es2m_training_dummy.py scripts/sync_es2m_latest_import_overlay.py scripts/apply_es2m_login_policy_runtime.py scripts/classify_es2m_latest_conflicts.py
          python3 -m unittest -v scripts/test_sync_es2m_latest_import_overlay.py scripts/test_apply_es2m_login_policy_runtime.py scripts/test_classify_es2m_latest_conflicts.py

      - name: Node syntax
        run: node --check scripts/test_original_player_creation_e2e.mjs

      - name: ES2M training dummy source contract
        run: python3 scripts/test_es2m_training_dummy.py

      - name: ES2M full source inventory and pin gate
        run: python3 scripts/test_es2m_source_sync_manifest.py

      - name: Safe latest ES2M additive importer unit tests
        run: python3 -m unittest -v scripts/test_import_es2m_latest_missing_files.py

      - name: Safe latest ES2M three-way merge unit tests
        run: python3 -m unittest -v scripts/test_merge_es2m_latest_changes_safe.py

      - name: Race and birth attribute source contracts
        run: |
          python3 scripts/test_es2m_birth_attribute_contract.py
          python3 scripts/test_es2m_race_command_contract.py

      - name: Verify ES2M login policy runtime contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          e2e = Path("scripts/test_original_player_creation_e2e.mjs").read_text(encoding="utf-8")
          shell = Path("scripts/test_original_player_creation_e2e.sh").read_text(encoding="utf-8")
          adapter = Path("scripts/apply_es2m_login_policy_runtime.py").read_text(encoding="utf-8")
          assert "async function testEs2mLoginPolicy()" in e2e
          assert "ES2M_PLAYER_CREATION_NUMERIC_ID_ACCEPTED_PASS" in e2e
          assert "ES2M_SINGLE_CHARACTER_DISPLAY_NAME_PASS" in e2e
          assert "ES2M_SINGLE_CHARACTER_DISPLAY_NAME_PASS" in shell
          assert "ID_CHAR_ES2M" in adapter and "NAME_CONDITION_ES2M" in adapter
          assert "ORIGINAL_PLAYER_CREATION_NUMERIC_ID_REJECTED_PASS" not in e2e
          print("ES2M LOGIN POLICY CONTRACT PASS: 3-12 lowercase alphanumeric ID; 1-18 UTF-8 display name")
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "## ES2-KING integration look gate"
            echo
            echo "- This workflow checks source syntax and static contracts only."
            echo "- It does not claim that the Docker build or the Neolith look preload passed."
            echo "- Full runtime verification remains in the Dockerfile gate."
          } >> "$GITHUB_STEP_SUMMARY"

  # Full Docker builder is opt-in via a meaningful commit message marker; no image push/deployment.
  docker-builder-validation:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[docker-validate]') }}
    name: Full Docker builder validation (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout integration branch and pinned ES2M source
        uses: actions/checkout@v4
        with:
          ref: integration/es2m-audit-import-20261017
          submodules: recursive
      - name: Build ES2M import audit stage (before gameplay gates)
        run: docker build --progress=plain --target es2m-import-audit -t es2-king-es2m-audit:ci .
      - name: Extract ES2M import reports and conflict-free overlay
        if: success()
        run: |
          mkdir -p es2m-reports
          container_id="$(docker create es2-king-es2m-audit:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for report in es2m-latest-qiaoyin-stage.json es2m-latest-additive-import.json es2m-latest-three-way-merge.json es2m-latest-conflict-classification.json; do
            docker cp "$container_id:/build/$report" "es2m-reports/$report"
          done
          docker cp "$container_id:/build/es2m-latest-import-overlay" /tmp/es2m-latest-import-overlay
          python3 scripts/sync_es2m_latest_import_overlay.py persist \
            --export-root /tmp/es2m-latest-import-overlay \
            --overlay-root es2m_snapshot/latest_import_overlay/71693beb/mudlib
          python3 - <<'PY'
          import json
          from pathlib import Path
          from os import environ
          summary = Path(environ["GITHUB_STEP_SUMMARY"])
          lines = ["## ES2M latest-source import report", ""]
          for path in sorted(Path("es2m-reports").glob("*.json")):
              data = json.loads(path.read_text(encoding="utf-8"))
              lines += [f"### {path.name}", f"- Status: `{data.get('status', 'unknown')}`"]
              for key, value in data.items():
                  if isinstance(value, list):
                      lines.append(f"- {key}: {len(value)}")
              lines.append("")
          manifest = json.loads(Path("/tmp/es2m-latest-import-overlay/manifest.json").read_text())
          lines += ["### Persistent KING overlay", f"- Pinned source: `{manifest['source_commit']}`", f"- Persisted conflict-free files: {manifest['file_count']}", f"- Conflicts excluded from overlay: {manifest['excluded_conflict_count']}", ""]
          classification = json.loads(Path("es2m-reports/es2m-latest-conflict-classification.json").read_text(encoding="utf-8"))
          lines += ["### Conflict classification", "- Additive conflicts classified: " + str(classification["additive_conflict_count"]), "- Three-way conflicts: " + str(classification["three_way_conflict_count"]), "- Categories: " + json.dumps(classification["summary"], ensure_ascii=False), ""]
          summary.write_text(summary.read_text(encoding="utf-8") + "\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Commit conflict-free ES2M changes into KING source tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es2m_snapshot/latest_import_overlay/71693beb
          if git diff --cached --quiet; then
            echo "No new conflict-free ES2M files to persist."
          else
            git commit -m "Persist conflict-free ES2M 71693beb imports [skip ci]"
            git push origin HEAD:integration/es2m-audit-import-20261017
          fi
      - name: Build full Docker builder target (including gameplay E2E)
        run: docker build --progress=plain --target builder -t es2-king-integration-validation:ci .
      - name: Upload ES2M import reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es2m-latest-import-reports
          path: es2m-reports/*.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Validation boundary summary
        if: always()
        run: |
          {
            echo "## ES2-KING Docker builder validation"
            echo
            echo "- Target: builder stage only; no registry push and no deployment."
            echo "- The build must pass the generated look.c Neolith preload gate and all subsequent Dockerfile gates."
          } >> "$GITHUB_STEP_SUMMARY"
