name: ES2-KING M30 Alpha
on:
  push:
    branches: [build/original-es2-races-phase2]
    paths: ['ROADMAP_M0_M30.md', 'original_es2/**', 'es2_king_expansion/**', 'king_library/**', 'scripts/test_m30_*', 'scripts/test_m*', 'scripts/test_admin_gm_*', '.github/workflows/es2-king-m30-alpha.yml']
  pull_request:
    paths: ['ROADMAP_M0_M30.md', 'original_es2/**', 'es2_king_expansion/**', 'king_library/**', 'scripts/test_m30_*', 'scripts/test_m*', 'scripts/test_admin_gm_*', '.github/workflows/es2-king-m30-alpha.yml']
  workflow_dispatch:
jobs:
  m30-alpha:
    name: ES2-KING Alpha 整合驗收
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Static Gate／完成矩陣與邊界
        run: bash scripts/test_m30_alpha_static.sh
      - name: Bootstrap／建立獨立 Expansion Runtime
        run: bash scripts/bootstrap_original_es2.sh .runtime/es2-king
      - name: Apply Expansion／套用 M26-M29 overlay
        run: bash scripts/apply_es2_king_expansion.sh .runtime/es2-king
      - name: Damage Formula Runtime Gate／生成 Runtime 傷害參數核對
        run: python3 scripts/test_king_martial_damage_formula.py --runtime .runtime/es2-king/mudlib
      - name: Runtime Gate／Original 與 Expansion 相容性
        run: bash scripts/test_m30_alpha_runtime_gate.sh .runtime/es2-king
      - name: Install build prerequisites／安裝建置依賴
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison libcmark-dev cmark
          python -m pip install --upgrade cmake
      - name: Driver Build／建置 Driver
        working-directory: .runtime/es2-king/neolith
        run: cmake --preset linux-gcc -DBUILD_TESTING=OFF && cmake --build --preset dev-linux-gcc
      - name: ADMIN GM LPC Load Gate／實際載入管理員指令
        run: bash scripts/test_admin_gm_lpc_boot.sh .runtime/es2-king
