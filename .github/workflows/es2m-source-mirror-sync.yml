name: ES2M Source Mirror Sync
# 由 GitHub Actions 自動封存 ES2M 上游差異；不直接覆蓋 KING Runtime。

on:
  push:
    branches:
      - build/original-es2-races-phase2
    paths:
      - '.github/workflows/es2m-source-mirror-sync.yml'
      - 'scripts/sync_es2m_source_mirror.py'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/es2m-source-mirror-sync.yml'
      - 'scripts/sync_es2m_source_mirror.py'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: es2m-source-mirror-sync
  cancel-in-progress: false

jobs:
  sync-source-evidence:
    # 同步提交若再次觸發，HEAD 相同時會安全地 NO-OP，不會形成無限提交。
    runs-on: ubuntu-latest
    steps:
      # Checkout／取得 KING 工作分支；所有變更只提交到這個分支。
      - name: Checkout KING branch
        uses: actions/checkout@v4
        with:
          ref: build/original-es2-races-phase2
          fetch-depth: 0

      # Python syntax gate／語法閘門：避免同步器語法錯誤時修改資料。
      - name: Validate sync script syntax
        run: python3 -m py_compile scripts/sync_es2m_source_mirror.py

      # Source sync／來源同步：保存完整錯誤輸出，失敗時也可追查真正原因。
      - name: Sync ES2M source evidence
        id: sync
        shell: bash
        run: |
          set +e
          python3 scripts/sync_es2m_source_mirror.py > /tmp/es2m-sync.log 2>&1
          rc=$?
          cat /tmp/es2m-sync.log
          if [ "$rc" -ne 0 ]; then
            mkdir -p docs/status
            {
              echo "# ES2M 同步失敗診斷"
              echo
              echo "- UTC：$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "- 分支：build/original-es2-races-phase2"
              echo "- Exit code：$rc"
              echo
              echo "同步器輸出："
              cat /tmp/es2m-sync.log
            } > docs/status/ES2M_SYNC_FAILURE.log
          fi
          exit "$rc"

      # Commit only generated evidence／成功時提交來源證據；失敗時只提交診斷，不發布半成品。
      - name: Commit source mirror, audit, or failure diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.sync.outcome }}" = "failure" ]; then
            git add docs/status/ES2M_SYNC_FAILURE.log
            message="ES2M: record source sync failure diagnostics"
          else
            git add es2m_source_mirror source/es2m_updates docs/status/ES2M_UPDATE_*_AUDIT.md
            message="ES2M: refresh upstream source mirror and archive"
          fi
          if git diff --cached --quiet; then
            echo "No generated ES2M evidence or failure diagnostic to commit."
            exit 0
          fi
          git commit -m "$message"
          git push origin HEAD:build/original-es2-races-phase2

      # Fail the job after publishing diagnostics／保留失敗狀態，避免把診斷提交誤報為同步成功。
      - name: Preserve failed sync status
        if: steps.sync.outcome == 'failure'
        run: exit 1
