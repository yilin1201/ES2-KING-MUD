name: Original ES2 M6-M9 種族驗證

# Workflow／工作流程：GitHub 自動執行測試的設定。
on:
  push:
    branches: [build/original-es2-races-phase2]
  pull_request:
    branches: [main]

jobs:
  race-phase2:
    # Job／測試工作：在 Linux 執行歷史種族靜態、Runtime、角色保存與真實戰鬥驗證。
    runs-on: ubuntu-latest
    steps:
      - name: Checkout／取得專案程式
        uses: actions/checkout@v4
      - name: Static verification／靜態驗證
        run: bash scripts/test_race_phase2_static.sh
      - name: Install build prerequisites／安裝編譯工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison netcat-openbsd
          python -m pip install --upgrade cmake
      - name: Bootstrap runtime／建立 Original ES2 執行環境
        run: bash scripts/bootstrap_original_es2.sh
      - name: Apply race overlay／套用歷史種族執行環境覆蓋層
        run: bash scripts/apply_race_phase2_runtime.sh
      - name: Verify generated race files／確認產生的種族程式
        shell: bash
        run: |
          set -euo pipefail
          root=.runtime/original-es2/mudlib/daemon/race
          # M6-M9：八項出生屬性全部暫定為 50。
          for race in headless yaksa ashura rainnar; do test -f "$root/$race.c"; for attr in str cps int spi cor dex con wis; do grep -q "\"$attr\":50" "$root/$race.c"; done; done
          # 其餘歷史重建種族：八項出生屬性暫定 25；Human/Avatar 保留 Original 基準。
          for race in blackteeth yenhold woochan dingling jiaojao malik; do test -f "$root/$race.c"; for attr in str cps int spi cor dex con wis; do grep -q "\"$attr\":25" "$root/$race.c"; done; done
          echo 'M6-M9 RUNTIME FILE PASS／執行環境種族檔案驗證通過'
      - name: Regression protection／Human Avatar 回歸保護
        # Regression Test／回歸測試：確認新增內容沒有破壞已完成的 M2/M5 Original 基準。
        run: bash scripts/test_race_phase2_regression.sh
      - name: Install live probes and combat fixture／安裝角色探針與戰鬥測試物件
        run: |
          cat > .runtime/original-es2/mudlib/cmds/usr/raceprobe.c <<'LPC'
          /* raceprobe／種族探針：僅存在測試 Runtime，用來讀取角色實際種族、出生屬性與精氣神。 */
          inherit F_CLEAN_UP;
          int main(object me,string arg){ string *keys=({"str","cps","int","spi","cor","dex","con","wis"}); string k,out="RACEPROBE"; foreach(k in keys) out+=sprintf(" %s=%d/%d",k,me->query_attr(k,1),me->query_attr(k)); out+=sprintf(" RACE=%s GIN=%d/%d KEE=%d/%d SEN=%d/%d",me->query_race(),me->query_stat("gin"),me->query_stat_maximum("gin"),me->query_stat("kee"),me->query_stat_maximum("kee"),me->query_stat("sen"),me->query_stat_maximum("sen")); write(out+"\n"); return 1; }
          LPC
          mkdir -p .runtime/original-es2/mudlib/obj/es2king_test
          cat > .runtime/original-es2/mudlib/obj/es2king_test/race_dummy.c <<'LPC'
          /* Combat fixture／戰鬥測試物件：Runtime-only 木樁武者，不寫入 Original ES2 保存層。 */
          #include <npc.h>
          inherit F_VILLAGER;
          void create(){ set_name("種族木樁武者",({"racedummy","dummy"})); set_race("human"); set_class("commoner"); set_level(1); set_attr("str",13); set_attr("cor",13); set_attr("int",13); set_attr("spi",13); set_attr("cps",13); set_attr("dex",13); set_attr("con",18); set_attr("wis",13); set("long","這是歷史種族 Runtime 戰鬥驗證使用的臨時對象。\n"); setup(); }
          int accept_fight(object ob){ do_chat("RACEFIGHT ACCEPTED: 種族木樁武者接受切磋。\n"); return 1; }
          LPC
          python - <<'PY'
          from pathlib import Path
          # Runtime-only fixture／僅測試執行環境：把木樁武者放進客棧廚房，不修改 Repository 保存的 Original 房間。
          p=Path('.runtime/original-es2/mudlib/d/snow/inn_kitchen.c'); s=p.read_text(); needle='\n\tsetup();\n'; assert needle in s
          s=s.replace(needle,'\n\tset("objects", ([ "/obj/es2king_test/race_dummy" : 1 ]));\n\tsetup();\n',1); p.write_text(s)
          PY
      - name: Configure Neolith／設定 MUD Driver 編譯
        working-directory: .runtime/original-es2/neolith
        run: cmake --preset linux -DBUILD_TESTING=OFF
      - name: Build Neolith／編譯 MUD Driver
        working-directory: .runtime/original-es2/neolith
        run: cmake --build --preset dev-linux
      - name: Locate driver／尋找 MUD Driver 執行檔
        run: |
          DRIVER="$(find .runtime/original-es2/neolith/out -type f -name neolith -perm -111 | head -n 1)"; test -n "$DRIVER"; echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"
      - name: Boot MUD／啟動 Original ES2
        shell: bash
        run: |
          set -euo pipefail; cd .runtime/original-es2; DRIVER_ABS="$(realpath "$GITHUB_WORKSPACE/$DRIVER")"; "$DRIVER_ABS" -f neolith.conf -c > "$RUNNER_TEMP/es2-race-phase2-boot.log" 2>&1 & PID=$!; echo "ES2_PID=$PID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do kill -0 "$PID" 2>/dev/null || break; if nc -z 127.0.0.1 4000; then exit 0; fi; sleep 1; done; cat "$RUNNER_TEMP/es2-race-phase2-boot.log"; exit 1
      - name: Live historical race persistence and combat／真實歷史種族保存與戰鬥驗證
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          # Telnet／文字連線協定：模擬玩家登入；Combat／戰鬥：使用 Original ES2 fight 指令實際交換攻擊文字。
          import telnetlib,time,re,sys
          ANSI=re.compile(r'\x1b\[[0-9;?]*[ -/]*[@-~]')
          def read(tn,b,t=.8):
              end=time.time()+t
              while time.time()<end:
                  try:
                      d=tn.read_very_eager()
                      if d:b.extend(d)
                  except (EOFError,ConnectionResetError,BrokenPipeError,OSError): break
                  time.sleep(.05)
          def line(tn,b,s,t=.8): tn.write(s.encode()+b'\r\n'); read(tn,b,t)
          def key(tn,b,s,t=.5): tn.write(s.encode()); read(tn,b,t)
          def clean(b): return ANSI.sub('',b.decode(errors='replace'))
          def probe(out,race,value,label,require_full_resources):
              m=re.search(r'RACEPROBE(.*?)(?:\n|$)',out)
              if not m or f'RACE={race}' not in m.group(1): sys.exit(f'{label} FAIL／失敗：{race} 種族不符')
              vals=[int(v) for _,v,_ in re.findall(r'(str|cps|int|spi|cor|dex|con|wis)=(\d+)/(\d+)',m.group(1))]
              if len(vals)!=8 or any(v!=value for v in vals): sys.exit(f'{label} FAIL／失敗：{race} 八項屬性不是 {value}：{vals}')
              # Fresh character／新角色建立時必須精氣神 30/30；戰鬥後重登只要求最大值仍為 30，因目前值可能已被戰鬥消耗並正常保存。
              if require_full_resources:
                  if not all(x in m.group(1) for x in ['GIN=30/30','KEE=30/30','SEN=30/30']): sys.exit(f'{label} FAIL／失敗：{race} 初始精氣神異常')
              else:
                  stats=re.findall(r'(GIN|KEE|SEN)=(\d+)/(\d+)',m.group(1))
                  if len(stats)!=3 or any(int(maximum)!=30 for _,current,maximum in stats): sys.exit(f'{label} FAIL／失敗：{race} 戰鬥後重登精氣神最大值異常：{stats}')
          # index／種族清單位置；M6-M9=50，其餘重建歷史種族=25。
          cases=[('blackteeth',0,'tblack','黑齒測試',25),('yenhold',3,'tyenhold','厭火測試',25),('woochan',4,'twoochan','無腸測試',25),('dingling',5,'tdinglin','釘靈測試',25),('jiaojao',6,'tjiaojao','焦僥測試',25),('rainnar',7,'msixrain','雨師妾測試',50),('ashura',8,'msevenashu','阿修羅測試',50),('headless',9,'meighthead','形天測試',50),('yaksa',10,'mnineyaks','夜叉測試',50),('malik',11,'tmalik','巫首測試',25)]
          for race,index,uid,name,value in cases:
              tn=telnetlib.Telnet('127.0.0.1',4000,timeout=5); b=bytearray(); read(tn,b,1); line(tn,b,uid); key(tn,b,'Y'); line(tn,b,'phasepass'); line(tn,b,'phasepass'); line(tn,b,'none')
              for _ in range(index): key(tn,b,'\x1b[B',.10)
              line(tn,b,'',.8); key(tn,b,'M'); line(tn,b,name); key(tn,b,'Y',1.2); line(tn,b,'raceprobe',.8); probe(clean(b),race,value,'LIVE',True)
              line(tn,b,'west',.4); line(tn,b,'look',.4); line(tn,b,'fight racedummy',2.5); line(tn,b,'hp',.6)
              combat=clean(b); flat=re.sub(r'\s+',' ',combat)
              if 'RACEFIGHT ACCEPTED' not in flat or '種族木樁武者' not in flat: sys.exit(f'COMBAT FAIL／戰鬥失敗：{race} 未進入真實 fight 流程')
              patterns=[r'你握緊拳頭往種族木樁武者',r'種族木樁武者.*向你',r'你.*往種族木樁武者.*踢',r'種族木樁武者.*一拳往你']
              if not any(re.search(p,flat) for p in patterns): sys.exit(f'COMBAT FAIL／戰鬥失敗：{race} 沒有真實雙向攻擊文字')
              line(tn,b,'quit',.5); tn.close()
              # Persistence／資料保存：重登後確認種族與出生屬性不變；戰鬥造成的目前資源消耗可以正常保存，不誤判成初始化失敗。
              tn=telnetlib.Telnet('127.0.0.1',4000,timeout=5); b2=bytearray(); read(tn,b2,1); line(tn,b2,uid); line(tn,b2,'phasepass',1.2); line(tn,b2,'raceprobe',.8); probe(clean(b2),race,value,'PERSISTENCE',False); line(tn,b2,'quit',.3); tn.close()
              print(f'LIVE+COMBAT+PERSISTENCE PASS／角色、戰鬥、保存重登通過：{race}，八屬性={value}。')
          PY
      - name: Stop MUD／停止測試伺服器
        if: always()
        run: |
          if [[ -n "${ES2_PID:-}" ]]; then kill "$ES2_PID" 2>/dev/null || true; fi
