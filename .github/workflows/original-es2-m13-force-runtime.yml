name: Original ES2 M13 Force Runtime

# Runtime／實機執行驗證：確認 Original force 映射、dragon force 內功與 exert 玩家指令可真正運作。
on:
  workflow_dispatch:
  push:
    branches: [build/original-es2-races-phase2]
    paths:
      - '.github/workflows/original-es2-m13-force-runtime.yml'
      - 'original_es2/research/original_martial_force_m13.md'
      - 'scripts/test_martial_force_m13_static.sh'
      - 'scripts/bootstrap_original_es2.sh'
  pull_request:
    paths:
      - '.github/workflows/original-es2-m13-force-runtime.yml'
      - 'original_es2/research/original_martial_force_m13.md'
      - 'scripts/test_martial_force_m13_static.sh'
      - 'scripts/bootstrap_original_es2.sh'

jobs:
  m13-force-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout／取得 ES2-KING 程式
        uses: actions/checkout@v4

      - name: Install prerequisites／安裝編譯工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison netcat-openbsd
          python -m pip install --upgrade cmake

      - name: Bootstrap runtime／建立 Original ES2 執行環境
        run: bash scripts/bootstrap_original_es2.sh

      - name: Force static regression／內功架構靜態回歸
        run: bash scripts/test_martial_force_m13_static.sh

      - name: Install Runtime-only force probe／安裝僅測試用內功探針
        run: |
          cat > .runtime/original-es2/mudlib/cmds/usr/m13force.c <<'LPC'
          inherit F_CLEAN_UP;

          // Runtime Probe／執行期探針：只建立可重現的測試前置資料，不取代 Original exert 指令。
          int main(object me, string arg)
          {
              if (arg == "prepare") {
                  // USER_PROTECT／玩家資料保護：測試資料使用 Mudlib 權限寫入，避免繞過 Original 保護機制。
                  seteuid(MUDLIB_UID);
                  me->set_skill("force", 80);
                  me->set_skill("dragon force", 80);
                  me->map_skill("force", "dragon force");
                  // Original dragon_force.c 執行內功至少需要精／氣／神各 10，因此先補滿既有上限。
                  me->set_stat("gin", me->query_stat_max("gin"));
                  me->set_stat("kee", me->query_stat_max("kee"));
                  me->set_stat("sen", me->query_stat_max("sen"));
                  seteuid(getuid());
              }
              write(sprintf("M13FORCE FORCE=%d DRAGON=%d MAP=%s GIN=%d KEE=%d SEN=%d\n",
                    me->query_skill("force", 1), me->query_skill("dragon force", 1),
                    me->skill_mapped("force") || "NONE", me->query_stat("gin"),
                    me->query_stat("kee"), me->query_stat("sen")));
              return 1;
          }
          LPC

      - name: Configure and build Neolith／設定並編譯 MUD Driver
        working-directory: .runtime/original-es2/neolith
        run: |
          cmake --preset linux -DBUILD_TESTING=OFF
          cmake --build --preset dev-linux

      - name: Locate driver／尋找 MUD Driver 執行檔
        run: |
          DRIVER="$(find .runtime/original-es2/neolith/out -type f -name neolith -perm -111 | head -n 1)"
          test -n "$DRIVER"
          echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"

      - name: Boot MUD／啟動 Original ES2
        shell: bash
        run: |
          set -euo pipefail
          cd .runtime/original-es2
          DRIVER_ABS="$(realpath "$GITHUB_WORKSPACE/$DRIVER")"
          "$DRIVER_ABS" -f neolith.conf -c > "$RUNNER_TEMP/es2-m13-force-boot.log" 2>&1 &
          PID=$!
          echo "ES2_PID=$PID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            kill -0 "$PID" 2>/dev/null || break
            if nc -z 127.0.0.1 4000; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/es2-m13-force-boot.log"
          exit 1

      - name: Live force and persistence verification／真實內功與保存重登驗證
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          # Telnet／文字連線協定：由真實玩家送出 exert dragon force，驗證不是直接呼叫技能函式的假測試。
          import telnetlib,time,re,sys
          ANSI=re.compile(r'\x1b\[[0-9;?]*[ -/]*[@-~]')
          STATE=re.compile(r'M13FORCE FORCE=(\d+) DRAGON=(\d+) MAP=([^\s]+) GIN=(\d+) KEE=(\d+) SEN=(\d+)')
          def session(): return telnetlib.Telnet('127.0.0.1',4000,timeout=5)
          def read(tn,buf,t=.8):
              end=time.time()+t
              while time.time()<end:
                  try:
                      d=tn.read_very_eager()
                      if d: buf.extend(d)
                  except (EOFError,OSError): break
                  time.sleep(.05)
          def line(tn,buf,s,t=.8): tn.write(s.encode()+b'\r\n'); read(tn,buf,t)
          def key(tn,buf,s,t=.8): tn.write(s.encode()); read(tn,buf,t)
          def clean(buf): return ANSI.sub('',buf.decode(errors='replace'))
          def last_state(text):
              m=STATE.findall(text)
              return m[-1] if m else None

          tn=session(); buf=bytearray(); read(tn,buf,1)
          line(tn,buf,'mforce'); key(tn,buf,'Y'); line(tn,buf,'mforcepass'); line(tn,buf,'mforcepass'); line(tn,buf,'none')
          key(tn,buf,'\r'); key(tn,buf,'M'); line(tn,buf,'內功測試'); key(tn,buf,'Y',1.5)
          line(tn,buf,'m13force prepare',.8)
          before=last_state(clean(buf))
          if not before or before[0] != '80' or before[1] != '80' or before[2] != 'dragon':
              # MAP 欄位若含空白，正規表示式會先讀到 dragon；後面另以完整文字確認 dragon force。
              text=clean(buf); print(text)
              if 'MAP=dragon force' not in text: sys.exit('M13 FORCE FAIL／失敗：force 未映射到 dragon force')
          before_text=clean(buf)
          if 'MAP=dragon force' not in before_text:
              print(before_text); sys.exit('M13 FORCE FAIL／失敗：映射狀態輸出錯誤')

          # 真正走 Original cmds/std/exert.c → mapped force Skill Daemon → dragon_force.c。
          mark=len(buf)
          line(tn,buf,'exert dragon force',2.0)
          read(tn,buf,2.0)
          exert_text=clean(buf[mark:])
          print(exert_text)
          if 'dragon force' in exert_text.lower() and 'M13FORCE' in exert_text:
              sys.exit('M13 FORCE FAIL／失敗：exert 未產生獨立 Original 執行結果')

          line(tn,buf,'halt',.5)
          mark=len(buf); line(tn,buf,'m13force',.8)
          after_text=clean(buf[mark:]); after=last_state(after_text); print(after_text)
          if not after or 'MAP=dragon force' not in after_text:
              sys.exit('M13 FORCE FAIL／失敗：exert 後無法讀取內功狀態')
          # dragon_force do_exercise() 啟動時會消耗精／氣／神；至少一項應低於 prepare 時補滿的值。
          before_resources=tuple(map(int,before[-3:]))
          after_resources=tuple(map(int,after[-3:]))
          if not any(a < b for a,b in zip(after_resources,before_resources)):
              sys.exit(f'M13 FORCE FAIL／失敗：exert 後精氣神未見消耗 before={before_resources} after={after_resources}')

          # Persistence／持久化：技能與 force 映射必須在 quit 後重新登入仍存在。
          line(tn,buf,'quit',1.2); tn.close()
          tn2=session(); buf2=bytearray(); read(tn2,buf2,1)
          line(tn2,buf2,'mforce'); line(tn2,buf2,'mforcepass',1.5)
          mark2=len(buf2); line(tn2,buf2,'m13force',.8)
          restored_text=clean(buf2[mark2:]); restored=last_state(restored_text); print(restored_text)
          if not restored or restored[0] != '80' or restored[1] != '80' or 'MAP=dragon force' not in restored_text:
              sys.exit('M13 FORCE FAIL／失敗：重新登入後技能或 force 映射未保存')
          print('M13 FORCE RUNTIME PASS／實機通過：force → dragon force 映射、真實 exert、資源消耗與重登保存均成立。')
          try: line(tn2,buf2,'quit',.3); tn2.close()
          except OSError: pass
          PY

      - name: Stop MUD／停止測試伺服器
        if: always()
        run: |
          if [[ -n "${ES2_PID:-}" ]]; then kill "$ES2_PID" 2>/dev/null || true; fi
