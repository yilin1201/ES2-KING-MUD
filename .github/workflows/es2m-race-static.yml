name: ES2-KING Race Integration Static Gates

on:
  push:
    branches:
      - audit/king-race-runtime-inventory-20261015
    paths:
      - "es2m_snapshot/mudlib/daemon/race/**"
      - "scripts/apply_race_phase2_runtime.sh"
      - "scripts/apply_es2m_20261008_world_delta.py"
      - "scripts/test_apply_es2m_20261008_world_delta.py"
      - "scripts/test_es2m_latest_martial_updates.py"
      - "scripts/test_original_player_creation_e2e.sh"
      - "scripts/test_player_open_alpha_e2e.sh"
      - "scripts/test_original_race_roster_source_gate.sh"
      - "scripts/assert_m30_final_runtime.sh"
      - "scripts/test_es2m_birth_attribute_contract.py"
      - "scripts/test_es2m_race_command_contract.py"
      - "scripts/test_race_phase2_static.sh"
      - "scripts/test_race_phase2_regression.sh"
      - "scripts/test_original_player_creation_e2e.mjs"
      - "Dockerfile"
      - ".github/workflows/es2m-race-static.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race-static:
    name: Race source and command contract (static only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check 12-race birth attribute ranges
        id: birth_contract
        continue-on-error: true
        run: |
          set +e
          python3 scripts/test_es2m_birth_attribute_contract.py 2>&1 | tee /tmp/birth-contract.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Check race command source, overlay and E2E contract
        id: command_contract
        continue-on-error: true
        run: |
          set +e
          python3 scripts/test_es2m_race_command_contract.py 2>&1 | tee /tmp/command-contract.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Check race overlay wiring
        id: overlay_static
        continue-on-error: true
        run: |
          set +e
          bash scripts/test_race_phase2_static.sh 2>&1 | tee /tmp/overlay-static.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Check ES2M world delta scope contract
        id: world_delta
        continue-on-error: true
        run: |
          set +e
          python3 scripts/test_apply_es2m_20261008_world_delta.py 2>&1 | tee /tmp/world-delta.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Check latest martial source/runtime file contract (static only)
        id: martial_contract
        continue-on-error: true
        run: |
          set +e
          python3 scripts/test_es2m_latest_martial_updates.py 2>&1 | tee /tmp/martial-contract.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Check final runtime and E2E shell syntax
        id: shell_syntax
        continue-on-error: true
        run: |
          set +e
          bash -n scripts/test_original_race_roster_source_gate.sh scripts/assert_m30_final_runtime.sh scripts/test_original_player_creation_e2e.sh scripts/test_player_open_alpha_e2e.sh 2>&1 | tee /tmp/shell-syntax.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"
      - name: Publish gate diagnostics
        if: always()
        env:
          BIRTH_OUTCOME: ${{ steps.birth_contract.outcome }}
          BIRTH_CODE: ${{ steps.birth_contract.outputs.exit_code }}
          COMMAND_OUTCOME: ${{ steps.command_contract.outcome }}
          COMMAND_CODE: ${{ steps.command_contract.outputs.exit_code }}
          OVERLAY_OUTCOME: ${{ steps.overlay_static.outcome }}
          OVERLAY_CODE: ${{ steps.overlay_static.outputs.exit_code }}
          WORLD_OUTCOME: ${{ steps.world_delta.outcome }}
          WORLD_CODE: ${{ steps.world_delta.outputs.exit_code }}
          MARTIAL_OUTCOME: ${{ steps.martial_contract.outcome }}
          MARTIAL_CODE: ${{ steps.martial_contract.outputs.exit_code }}
          SHELL_OUTCOME: ${{ steps.shell_syntax.outcome }}
          SHELL_CODE: ${{ steps.shell_syntax.outputs.exit_code }}
        run: |
          {
            echo "## ES2-KING race static gate diagnostics"
            echo
            echo "| Gate | Outcome | Exit code |"
            echo "|---|---|---:|"
            echo "| Birth attribute contract | ${BIRTH_OUTCOME:-NOT_RUN} | ${BIRTH_CODE:-unknown} |"
            echo "| Race command contract | ${COMMAND_OUTCOME:-NOT_RUN} | ${COMMAND_CODE:-unknown} |"
            echo "| Overlay wiring | ${OVERLAY_OUTCOME:-NOT_RUN} | ${OVERLAY_CODE:-unknown} |"
            echo "| World delta scope contract | ${WORLD_OUTCOME:-NOT_RUN} | ${WORLD_CODE:-unknown} |"
            echo "| Latest martial source contract | ${MARTIAL_OUTCOME:-NOT_RUN} | ${MARTIAL_CODE:-unknown} |"
            echo "| Final runtime/E2E shell syntax | ${SHELL_OUTCOME:-NOT_RUN} | ${SHELL_CODE:-unknown} |"
            echo
            echo "These are static source checks only; they do not establish LPC/Neolith runtime or player E2E PASS."
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/race-static-diagnostics
          for f in /tmp/birth-contract.log /tmp/command-contract.log /tmp/overlay-static.log /tmp/world-delta.log /tmp/martial-contract.log /tmp/shell-syntax.log; do
            if [ -f "$f" ]; then cp "$f" /tmp/race-static-diagnostics/; fi
          done
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: es2m-race-static-diagnostics
          path: /tmp/race-static-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if any static gate failed
        if: always()
        env:
          BIRTH_OUTCOME: ${{ steps.birth_contract.outcome }}
          COMMAND_OUTCOME: ${{ steps.command_contract.outcome }}
          OVERLAY_OUTCOME: ${{ steps.overlay_static.outcome }}
          WORLD_OUTCOME: ${{ steps.world_delta.outcome }}
          MARTIAL_OUTCOME: ${{ steps.martial_contract.outcome }}
          SHELL_OUTCOME: ${{ steps.shell_syntax.outcome }}
        run: |
          if [ "$BIRTH_OUTCOME" != "success" ] || [ "$COMMAND_OUTCOME" != "success" ] || [ "$OVERLAY_OUTCOME" != "success" ] || [ "$WORLD_OUTCOME" != "success" ] || [ "$MARTIAL_OUTCOME" != "success" ] || [ "$SHELL_OUTCOME" != "success" ]; then
            echo "One or more static gates failed; see job summary and artifact."
            exit 1
          fi

  docker-builder-validation:
    # Expensive full build runs only on an explicitly tagged commit; never deploy or push an image.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[docker-validate]') }}
    name: Full Docker builder validation (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
      - name: Build full Dockerfile builder target
        run: docker build --progress=plain --target builder -t es2-king-validation:ci .
