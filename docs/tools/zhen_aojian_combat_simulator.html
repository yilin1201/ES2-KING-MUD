<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真・傲劍訣戰鬥模擬器</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#101115;color:#eee;font:17px/1.75 system-ui,"Noto Sans TC",sans-serif}main{max-width:860px;margin:auto;border:1px solid #846b3c;border-radius:18px;padding:20px}h1{text-align:center;color:#f4d27d;margin:0}p{text-align:center;color:#aaa;margin:0 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{cursor:pointer;background:#1e2026;border:1px solid #53535b;border-radius:12px;padding:12px;color:white;font-size:18px}button.active{border:2px solid var(--c)}.all{width:100%;margin:18px 0;border-radius:30px}.screen{background:#08090c;padding:16px;border:1px solid #3a3a40;border-radius:12px;overflow-wrap:anywhere}.move{padding:10px 0;border-bottom:1px solid #32343a}.move:last-child{border:0}.rainbow b:nth-child(1){color:#ff595e}.rainbow b:nth-child(2){color:#ffe26b}.rainbow b:nth-child(3){color:#51e57c}.rainbow b:nth-child(4){color:#58e1e9}small{color:#aaa}input{background:#222;color:white;border:1px solid #666;border-radius:6px;padding:8px;max-width:180px}@media(max-width:500px){body{padding:8px}main{padding:12px}.grid{gap:6px}button{padding:8px}}</style></head><body><main><h1>真・傲劍訣</h1><p>九式・劍領風騷（連續預覽不顯示 -kee max）</p><div class="grid" id="buttons"></div><button class="all" id="all" onclick="toggleAll()"></button><div class="screen" id="screen" aria-live="polite"></div><p style="margin-top:16px">獨立文字預覽；不修改遊戲武學、傷害或玩家資料。</p></main><script>const moves=[{"name":"旋","color":"#ff555b","aura":"紅色","cost":11},{"name":"雷","color":"#48e678","aura":"綠色","cost":12},{"name":"嘯","color":"#5a95ff","aura":"藍色","cost":14},{"name":"擎","color":"#d47bdf","aura":"紫色","cost":16},{"name":"破","color":"#4ae5ed","aura":"青色","cost":20},{"name":"仁","color":"#ffffff","aura":"白色","cost":25},{"name":"狂","color":"#ffe64e","aura":"黃色","cost":33},{"name":"天","color":"#ffce4c","aura":"金色","cost":50},{"name":"滅","color":"#999999","aura":"黑色","cost":100}];const rainbow='<span class="rainbow"><b>劍</b><b>領</b><b>風</b><b>騷</b></span>';let selected=0,all=false;function controls(){document.getElementById('buttons').innerHTML=moves.map((m,i)=>'<button style="--c:'+m.color+';color:'+m.color+'" class="'+(!all&&selected===i?'active':'')+'" onclick="selected='+i+';all=false;render()">【'+m.name+'】'+(m.cost?'<br><small>kee '+m.cost+'</small>':'')+'</button>').join('');document.getElementById('all').textContent=all?'返回單式預覽':'連續施展全部'+moves.length+'式'}function toggleAll(){all=!all;render()}function render(){controls();document.getElementById('screen').innerHTML=(all?moves:[moves[selected]]).map(m=>'<div class="move">蔚楓施展傲劍訣中的極招「'+rainbow+'」．<strong style="color:'+m.color+'">【'+m.name+'】</strong>！'+(all?'':' <span style="color:'+(m.name==='滅'?'#ff555b':m.color)+'">-kee max '+m.cost+'</span>')+'<br>蔚楓手上的劍發出了一道<strong style="color:'+m.color+'">'+m.aura+'的劍氣</strong>射向你！</div>').join('')}render();</script></body></html>
