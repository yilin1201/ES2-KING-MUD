name: Original ES2 M12 Study Runtime

# GitHub Actions／GitHub 自動化測試：玩家必須真的輸入 study，驗證 learned 學習進度與保存重登。
on:
  workflow_dispatch:
  push:
    branches: [build/original-es2-races-phase2]
    paths:
      - '.github/workflows/original-es2-m12-study-runtime.yml'
      - 'original_es2/research/original_study_*'
      - 'scripts/test_study_m12_static.sh'
      - 'scripts/bootstrap_original_es2.sh'
  pull_request:
    paths:
      - '.github/workflows/original-es2-m12-study-runtime.yml'
      - 'original_es2/research/original_study_*'
      - 'scripts/test_study_m12_static.sh'
      - 'scripts/bootstrap_original_es2.sh'

jobs:
  m12-study-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout／取得 ES2-KING 程式
        uses: actions/checkout@v4

      - name: Install prerequisites／安裝編譯工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build bison netcat-openbsd
          python -m pip install --upgrade cmake

      - name: Bootstrap runtime／建立 Original ES2 執行環境
        run: bash scripts/bootstrap_original_es2.sh

      - name: Study static regression／研讀公式靜態回歸
        run: bash scripts/test_study_m12_static.sh

      - name: Install Runtime-only study fixture／安裝僅測試用研讀物件與探針
        run: |
          # Fixture／測試夾具：只存在 .runtime，不改動保存用途的 Original ES2 原始碼。
          cat > .runtime/original-es2/mudlib/obj/m12studybook.c <<'LPC'
          inherit ITEM;
          inherit F_STUDY;

          void create()
          {
              // USER_PROTECT／使用者資料保護：Original user.c 只允許 ROOT、DOMAIN、MUDLIB 或玩家本人修改技能資料。
              // 研讀的 improve_skill() 是由書本物件回呼，因此測試書必須使用 MUDLIB_UID；不修改 Original study.c。
              seteuid(MUDLIB_UID);
              set_name("研讀測試卷", ({ "study sheet", "sheet" }));
              set_weight(1);
              // content／研讀內容：單一 unarmed 可提高成功機率，也保留 Original 隨機學習機制。
              set("content", ([ "unarmed" : 50 ]));
              set("study_msg", "$N開始研讀測試卷上的徒手心得。\n");
          }
          LPC

          cat > .runtime/original-es2/mudlib/cmds/usr/m12study.c <<'LPC'
          inherit F_CLEAN_UP;

          // Runtime Probe／執行期探針：只負責建立測試前置條件、放置書卷與輸出 Original 學習資料。
          int main(object me, string arg)
          {
              object book;
              if (arg == "prepare") {
                  // User protection／使用者保護：測試前置資料使用 Mudlib 權限，真正學習仍由玩家 study 指令完成。
                  seteuid(MUDLIB_UID);
                  me->set_skill("literate", 100);
                  me->set_skill("unarmed", 1);
                  me->set_learn("unarmed", 0);
                  // Original Human 初始精神上限只有 30；把目前值補滿即可，不假裝突破 Original 上限。
                  me->set_stat("gin", me->query_stat_max("gin"));
                  me->set_stat("sen", me->query_stat_max("sen"));
                  seteuid(getuid());
                  book = new("/obj/m12studybook");
                  if (book) book->move(me);
              }
              write(sprintf("M12STUDY SKILL=%d LEARN=%d GIN=%d SEN=%d FATIGUE=%d\n",
                    me->query_skill("unarmed", 1), me->query_learn("unarmed"),
                    me->query_stat("gin"), me->query_stat("sen"), me->query_stat("fatigue")));
              return 1;
          }
          LPC

      - name: Configure and build Neolith／設定並編譯 MUD Driver
        working-directory: .runtime/original-es2/neolith
        run: |
          cmake --preset linux -DBUILD_TESTING=OFF
          cmake --build --preset dev-linux

      - name: Locate driver／尋找 MUD Driver 執行檔
        run: |
          DRIVER="$(find .runtime/original-es2/neolith/out -type f -name neolith -perm -111 | head -n 1)"
          test -n "$DRIVER"
          echo "DRIVER=$DRIVER" >> "$GITHUB_ENV"

      - name: Boot MUD／啟動 Original ES2
        shell: bash
        run: |
          set -euo pipefail
          cd .runtime/original-es2
          DRIVER_ABS="$(realpath "$GITHUB_WORKSPACE/$DRIVER")"
          "$DRIVER_ABS" -f neolith.conf -c > "$RUNNER_TEMP/es2-m12-study-boot.log" 2>&1 &
          PID=$!
          echo "ES2_PID=$PID" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            kill -0 "$PID" 2>/dev/null || break
            if nc -z 127.0.0.1 4000; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/es2-m12-study-boot.log"
          exit 1

      - name: Live study and persistence verification／真實研讀與保存重登驗證
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          # Telnet／文字連線協定：建立真實玩家，真正送出 study 指令，不直接用探針增加 learned。
          import telnetlib,time,re,sys
          ANSI=re.compile(r'\x1b\[[0-9;?]*[ -/]*[@-~]')
          STATE=re.compile(r'M12STUDY SKILL=(\d+) LEARN=(\d+) GIN=(\d+) SEN=(\d+) FATIGUE=(\d+)')
          def session(): return telnetlib.Telnet('127.0.0.1',4000,timeout=5)
          def read(tn,buf,t=.8):
              end=time.time()+t
              while time.time()<end:
                  try:
                      d=tn.read_very_eager()
                      if d: buf.extend(d)
                  except (EOFError,OSError): break
                  time.sleep(.05)
          def line(tn,buf,s,t=.8): tn.write(s.encode()+b'\r\n'); read(tn,buf,t)
          def key(tn,buf,s,t=.8): tn.write(s.encode()); read(tn,buf,t)
          def clean(buf): return ANSI.sub('',buf.decode(errors='replace'))
          def state(text):
              m=STATE.findall(text)
              return tuple(map(int,m[-1])) if m else None

          tn=session(); buf=bytearray(); read(tn,buf,1)
          line(tn,buf,'mstudy'); key(tn,buf,'Y'); line(tn,buf,'mstudypass'); line(tn,buf,'mstudypass'); line(tn,buf,'none')
          key(tn,buf,'\r'); key(tn,buf,'M'); line(tn,buf,'研讀測試'); key(tn,buf,'Y',1.5)
          line(tn,buf,'m12study prepare',.8)
          before=state(clean(buf))
          if not before or before[1] != 0:
              print(clean(buf)); sys.exit('M12 STUDY FAIL／失敗：無法建立研讀前置狀態')

          learned=0
          for _ in range(20):
              # Original study 可能持續觸發學習回呼；測試只要求玩家真實研讀後 learned 確實由 0 增加。
              mark=len(buf)
              line(tn,buf,'study sheet',1.2)
              read(tn,buf,1.8)
              line(tn,buf,'m12study',.6)
              cur=state(clean(buf[mark:]))
              if cur and cur[1] > 0:
                  learned=cur[1]; break
              line(tn,buf,'halt',.5)
          first=clean(buf); print(first)
          if learned <= 0:
              sys.exit('M12 STUDY FAIL／失敗：20 次真實 study 後 learned 仍未增加')

          # Persistence／保存驗證：Original 的研讀回呼在離線前仍可能繼續增加 learned。
          # 因此重登值只要不低於已確認的學習值，即證明已學進度沒有因 quit/relogin 遺失；不強迫非同步值完全相等。
          confirmed_learned=learned
          line(tn,buf,'quit',1.2); tn.close()
          tn2=session(); buf2=bytearray(); read(tn2,buf2,1)
          line(tn2,buf2,'mstudy'); line(tn2,buf2,'mstudypass',1.5)
          mark2=len(buf2)
          line(tn2,buf2,'m12study',.8)
          second=clean(buf2); print(second)
          restored=state(clean(buf2[mark2:]))
          if not restored or restored[1] < confirmed_learned:
              sys.exit(f'M12 STUDY FAIL／失敗：重新登入 learned={restored[1] if restored else "NONE"}，低於離線前已確認值={confirmed_learned}')
          print(f'M12 STUDY RUNTIME PASS／實機通過：study 已確認 learned>0，重登 restored={restored[1]} 且未低於已確認值={confirmed_learned}。')
          try: line(tn2,buf2,'quit',.3); tn2.close()
          except OSError: pass
          PY

      - name: Stop MUD／停止測試伺服器
        if: always()
        run: |
          if [[ -n "${ES2_PID:-}" ]]; then kill "$ES2_PID" 2>/dev/null || true; fi
